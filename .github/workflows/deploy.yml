name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/string-generator-app-COmXq]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secret is available
        run: |
          if [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "ERROR: ANTHROPIC_API_KEY secret is empty or not set!"
            exit 1
          else
            echo "Secret is set (length: $(echo -n '${{ secrets.ANTHROPIC_API_KEY }}' | wc -c))"
          fi

      - name: Inject API key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "=== Before injection ==="
          grep -n 'ANTHROPIC_API_KEY' index.html
          python3 -c "import os; k=os.environ['ANTHROPIC_API_KEY']; print('Key length:', len(k)); c=open('index.html').read(); replaced=c.replace('%%ANTHROPIC_API_KEY%%',k); open('index.html','w').write(replaced); print('Placeholder count after:', replaced.count('%%ANTHROPIC_API_KEY%%'))"
          echo "=== After injection ==="
          grep -n 'ANTHROPIC_API_KEY' index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - uses: actions/deploy-pages@v4
        id: deployment
