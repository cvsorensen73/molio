name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/string-generator-app-COmXq]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Inject API key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 -c "
import os
key = os.environ['ANTHROPIC_API_KEY']
with open('index.html', 'r') as f:
    content = f.read()
content = content.replace('%%ANTHROPIC_API_KEY%%', key)
with open('index.html', 'w') as f:
    f.write(content)
print('Injection result:', '%%ANTHROPIC_API_KEY%%' not in content)
"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - uses: actions/deploy-pages@v4
        id: deployment
